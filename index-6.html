<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matchbites — Let's find your next meal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --bg-warm:#FFFCF6;
    --yellow:#FFC839;
    --yellow-deep:#F0A202;
    --ink:#15130F;
    --gray:#8B8880;
    --gray-light:#B9B6AC;
    --line:#EEEAE0;
    --shadow-sm: 0 1px 2px rgba(21,19,15,0.04), 0 2px 8px rgba(21,19,15,0.04);
    --shadow-md: 0 4px 16px rgba(21,19,15,0.08), 0 1px 3px rgba(21,19,15,0.06);
    --shadow-lg: 0 12px 32px rgba(21,19,15,0.12), 0 2px 8px rgba(21,19,15,0.06);
    --radius-sm: 12px;
    --radius-md: 18px;
    --radius-lg: 28px;
    --radius-pill: 999px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Inter', -apple-system, sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    padding-bottom:40px;
  }
  .display{font-family:'Space Grotesk', sans-serif;}
  a{text-decoration:none; color:inherit;}
  button{font-family:inherit; border:none; background:none; cursor:pointer;}
  img{display:block; width:100%; height:100%; object-fit:cover;}

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px;
    position:sticky; top:0; z-index:50;
    background:rgba(255,255,255,0.88);
    backdrop-filter:blur(10px);
    border-bottom:1px solid transparent;
    transition:border-color .2s ease;
  }
  .topbar.scrolled{border-bottom-color:var(--line);}
  .logo{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:19px;
    letter-spacing:-0.02em;
    display:flex; align-items:center; gap:8px;
  }
  .logo .dot{width:9px; height:9px; border-radius:50%; background:var(--yellow); box-shadow:0 0 0 4px rgba(255,200,57,0.25);}
  .icon-btn{
    width:38px; height:38px; border-radius:50%;
    background:var(--bg-warm); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
  }

  /* ---------- Hero ---------- */
  .hero{
    padding:28px 20px 8px;
    text-align:left;
  }
  .eyebrow{
    font-size:12.5px; font-weight:600; color:var(--gray);
    letter-spacing:0.06em; text-transform:uppercase;
    margin-bottom:14px;
    display:flex; align-items:center; gap:6px;
  }
  .eyebrow::before{content:''; width:16px; height:2px; background:var(--yellow-deep); border-radius:2px;}
  h1.headline{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:38px;
    line-height:1.03;
    letter-spacing:-0.02em;
    max-width:11ch;
  }
  h1.headline .accent{
    color:var(--yellow-deep);
    position:relative;
  }
  .subtitle{
    margin-top:14px;
    font-size:15.5px;
    color:var(--gray);
    line-height:1.5;
    max-width:34ch;
  }

  /* ---------- Search ---------- */
  .search-wrap{ padding:22px 20px 4px; }
  .search-pill{
    display:flex; align-items:center; gap:10px;
    background:var(--bg);
    border:1.5px solid var(--line);
    border-radius:var(--radius-pill);
    padding:6px 6px 6px 20px;
    box-shadow:var(--shadow-sm);
    transition:box-shadow .18s ease, border-color .18s ease;
  }
  .search-pill:focus-within{
    border-color:var(--ink);
    box-shadow:var(--shadow-md);
  }
  .search-pill svg{flex-shrink:0; color:var(--gray-light);}
  .search-pill input{
    border:none; outline:none; flex:1;
    font-family:'Inter', sans-serif;
    font-size:15.5px; font-weight:500;
    color:var(--ink);
    background:transparent;
    min-width:0;
  }
  .search-pill input::placeholder{color:var(--gray-light); font-weight:400;}
  .search-go{
    flex-shrink:0;
    background:var(--ink); color:#fff;
    width:44px; height:44px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s ease;
  }
  .search-go:hover{background:var(--yellow-deep);}

  /* ---------- Category dock ---------- */
  .categories{
    padding:22px 0 6px;
  }
  .categories-scroll{
    display:flex; gap:10px;
    overflow-x:auto;
    padding:0 20px 6px;
    scrollbar-width:none;
  }
  .categories-scroll::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0;
    display:flex; align-items:center; gap:7px;
    padding:11px 16px;
    border-radius:var(--radius-pill);
    border:1.5px solid var(--line);
    background:var(--bg);
    font-size:14px; font-weight:600;
    color:var(--ink);
    white-space:nowrap;
    transition:all .15s ease;
  }
  .chip .emoji{font-size:16px;}
  .chip:hover{border-color:var(--gray-light);}
  .chip.active{
    background:var(--yellow);
    border-color:var(--yellow);
    color:var(--ink);
    box-shadow:var(--shadow-sm);
  }
  .chip.surprise{
    background:var(--ink); color:#fff; border-color:var(--ink);
  }
  .chip.surprise:hover{background:var(--yellow-deep); border-color:var(--yellow-deep);}

  /* ---------- Directory section ---------- */
  .directory{ padding:38px 20px 0; }
  .directory-head{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:16px;
  }
  .directory-head h2{
    font-family:'Space Grotesk', sans-serif;
    font-size:22px; font-weight:700; letter-spacing:-0.01em;
  }
  .result-count{
    font-size:13px; color:var(--gray); font-weight:500;
  }

  /* ---------- Filters ---------- */
  .filters{
    display:flex; gap:8px;
    overflow-x:auto;
    padding-bottom:14px;
    scrollbar-width:none;
  }
  .filters::-webkit-scrollbar{display:none;}
  .filter-select{
    flex-shrink:0;
    appearance:none;
    -webkit-appearance:none;
    font-family:'Inter', sans-serif;
    font-size:13.5px; font-weight:600;
    color:var(--ink);
    background:var(--bg-warm) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1L5 5L9 1" stroke="%2315130F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>') no-repeat right 12px center;
    border:1px solid var(--line);
    border-radius:var(--radius-pill);
    padding:10px 30px 10px 16px;
    cursor:pointer;
  }

  /* ---------- Cards ---------- */
  .cards{
    display:flex; flex-direction:column; gap:14px;
    padding-top:6px;
  }
  .card{
    border:1px solid var(--line);
    border-radius:var(--radius-md);
    padding:18px;
    background:var(--bg);
    box-shadow:var(--shadow-sm);
    transition:box-shadow .18s ease, transform .18s ease;
  }
  .card:hover{ box-shadow:var(--shadow-md); transform:translateY(-1px); }
  .card-top{
    display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
    margin-bottom:10px;
  }
  .card-name{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:17.5px;
    letter-spacing:-0.01em;
    line-height:1.25;
  }
  .price-tag{
    flex-shrink:0;
    font-size:12px; font-weight:700;
    background:var(--yellow);
    color:var(--ink);
    padding:4px 9px;
    border-radius:var(--radius-pill);
  }
  .card-meta{
    display:flex; flex-wrap:wrap; gap:6px 10px;
    font-size:13px; color:var(--gray); font-weight:500;
    margin-bottom:12px;
  }
  .card-meta .dot-sep{color:var(--gray-light);}
  .card-details{
    display:flex; flex-direction:column; gap:5px;
    font-size:13px; color:var(--gray);
    border-top:1px solid var(--line);
    padding-top:12px;
    margin-bottom:14px;
  }
  .card-details div{display:flex; gap:7px; align-items:flex-start;}
  .card-details svg{flex-shrink:0; margin-top:1px; color:var(--gray-light);}
  .card-actions{
    display:flex; gap:8px;
  }
  .btn{
    flex:1;
    display:flex; align-items:center; justify-content:center; gap:6px;
    padding:11px 14px;
    border-radius:var(--radius-sm);
    font-size:13.5px; font-weight:700;
    transition:opacity .15s ease;
  }
  .btn:hover{opacity:0.85;}
  .btn-menu{ background:var(--bg-warm); border:1px solid var(--line); color:var(--ink); }
  .btn-directions{ background:var(--ink); color:#fff; }
  .btn-disabled{ background:var(--bg-warm); border:1px solid var(--line); color:var(--gray-light); cursor:default; }
  .hours-row .hours-text{
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  /* ---------- Empty state ---------- */
  .empty{
    text-align:center; padding:50px 20px; color:var(--gray);
    display:none;
  }
  .empty.show{display:block;}
  .empty .emoji{font-size:34px; margin-bottom:10px;}

  /* ---------- Desktop polish ---------- */
  @media (min-width:720px){
    .topbar, .hero, .search-wrap, .directory{ max-width:640px; margin:0 auto; }
    .categories-scroll{ max-width:640px; margin:0 auto; padding-left:0; padding-right:0; }
    h1.headline{ font-size:46px; max-width:14ch; }
    .cards{ display:grid; grid-template-columns:1fr 1fr; }
  }
</style>
</head>

  <section class="directory" id="directory">

      <select class="filter-select" id="neighborhoodFilter">

    <div class="empty" id="emptyState">

      <div>No restaurants match those filters.</div>
    </div>
  </section>

const cardsContainer = document.getElementById('cardsContainer');
const emptyState = document.getElementById('emptyState');
const resultCount = document.getElementById('resultCount');

function pinSVG(){return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 22s7-7.16 7-12A7 7 0 1 0 5 10c0 4.84 7 12 7 12Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="10" r="2.4" stroke="currentColor" stroke-width="1.8"/></svg>`;}
function clockSVG(){return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 7V12L15.5 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`;}
function phoneSVG(){return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C11.6 21 3 12.4 3 2c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1L6.6 10.8Z" stroke="currentColor" stroke-width="1.6"/></svg>`;}

const TOTAL_COUNT = restaurants.length;

function esc(s){ return (s||'').replace(/"/g,'&quot;'); }

function renderCards(list){
  cardsContainer.innerHTML = list.map(r => `
    <div class="card">
      <div class="card-top">
        <div class="card-name">${r.name}</div>
        <div class="price-tag">${r.price}</div>
      </div>
      <div class="card-meta">
        <span>${r.cuisine}</span><span class="dot-sep">•</span><span>${r.neighborhood}</span>
      </div>
      <div class="card-details">
        <div>${pinSVG()}<span>${r.address}</span></div>
        <div class="hours-row">${clockSVG()}<span class="hours-text" title="${esc(r.hours)}">${r.hours}</span></div>
        ${r.phone ? `<div>${phoneSVG()}<span>${r.phone}</span></div>` : ''}
      </div>
      <div class="card-actions">
        ${r.menu ? `<a class="btn btn-menu" href="${r.menu}" target="_blank" rel="noopener">Menu</a>` : `<span class="btn btn-menu btn-disabled">No menu yet</span>`}
        <a class="btn btn-directions" href="${r.directions}" target="_blank" rel="noopener">Directions</a>
      </div>
    </div>
  `).join('');
  resultCount.textContent = list.length === restaurants.length
    ? `${TOTAL_COUNT} Verified Restaurants`
    : `${list.length} of ${TOTAL_COUNT} Verified Restaurants`;
  emptyState.classList.toggle('show', list.length === 0);
}

function populateFilters(){
  const uniq = (key) => [...new Set(restaurants.map(r => r[key]).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  const fill = (id, values) => {
    const sel = document.getElementById(id);
    values.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v; opt.textContent = v;
      sel.appendChild(opt);
    });
  };
  fill('cuisineFilter', uniq('cuisine'));
  fill('priceFilter', ['$','$$','$$$','$$$$']);
  fill('boroughFilter', uniq('borough'));
  fill('neighborhoodFilter', uniq('neighborhood'));
}

let activeChipKeyword = '';

function applyFilters(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const cuisine = document.getElementById('cuisineFilter').value;
  const price = document.getElementById('priceFilter').value;
  const borough = document.getElementById('boroughFilter').value;
  const neighborhood = document.getElementById('neighborhoodFilter').value;

  const filtered = restaurants.filter(r => {
    const haystack = (r.name + ' ' + r.cuisine).toLowerCase();
    return (!q || haystack.includes(q)) &&
      (!activeChipKeyword || haystack.includes(activeChipKeyword)) &&
      (!cuisine || r.cuisine === cuisine) &&
      (!price || r.price === price) &&
      (!borough || r.borough === borough) &&
      (!neighborhood || r.neighborhood === neighborhood);
  });
  renderCards(filtered);
}

document.getElementById('searchInput').addEventListener('input', applyFilters);
['cuisineFilter','priceFilter','boroughFilter','neighborhoodFilter'].forEach(id=>{
  document.getElementById(id).addEventListener('change', applyFilters);
});

document.querySelectorAll('.chip[data-kw]').forEach(chip=>{
  chip.addEventListener('click', ()=>{
    document.querySelectorAll('.chip[data-kw]').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    activeChipKeyword = chip.dataset.kw;
    applyFilters();
    document.getElementById('directory').scrollIntoView({behavior:'smooth', block:'start'});
  });
});

document.getElementById('surpriseBtn').addEventListener('click', ()=>{
  const pick = restaurants[Math.floor(Math.random()*restaurants.length)];
  renderCards([pick]);
  resultCount.textContent = "Your pick 🎲";
  document.getElementById('directory').scrollIntoView({behavior:'smooth', block:'start'});
});

window.addEventListener('scroll', ()=>{
  document.getElementById('topbar').classList.toggle('scrolled', window.scrollY > 8);
});

populateFilters();
renderCards(restaurants);
</script>
</body>
</html>
